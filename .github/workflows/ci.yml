name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

# Each job downloads public modules, then runs its checks with GOPROXY=off to
# prove builds work offline from the committed OpenAPI snapshot.
jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make deps
      - run: make check-sdk
        env:
          GOPROXY: "off"

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make deps
      - run: make check-cli
        env:
          GOPROXY: "off"

  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make deps
      - run: make check-generated
        env:
          GOPROXY: "off"
